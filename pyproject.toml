[project]
name = "computer-use-sandbox"
version = "0.1.0"
description = "Computer-use and browser-use agents on Baseten Sandboxes"
requires-python = ">=3.11"
dependencies = [
    "baseten>=0.14",
    "httpx[http2]>=0.27",
    "openai>=1.60",
    "playwright>=1.55",
]

[dependency-groups]
dev = ["pytest>=8", "pillow>=10", "websockets>=13"]

[project.scripts]
computer-use = "computer_use.__main__:main"
computer-use-image = "computer_use.image:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["computer_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["agent: runs a model on the desktop (costs model tokens)"]
